<!-- Адреса от корня домена: эта страница открывается на любом несуществующем пути. При переезде на свой домен убрать /pukh-i-losk -->
<link rel="icon" href="/pukh-i-losk/assets/favicon.svg" type="image/svg+xml">

<style>
:root { color-scheme: light; --cream: #FFF8F3; --rose: #C2415A; --rose-deep: #A1304A; --plum: #2E1A3A; --plum-soft: #5D4A69; --white: #FFFFFF; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--cream); color: var(--plum);
  font: 400 1.0625rem/1.6 "Onest", "Segoe UI", system-ui, sans-serif;
  padding-block: 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { display: grid; gap: 20px; justify-items: center; text-align: center; max-width: 560px; }
svg { width: 96px; height: 96px; color: var(--rose); rotate: -14deg; }
h1 { margin: 0; font: 700 clamp(1.5rem, 1rem + 2.4vw, 2.4rem)/1.2 "Unbounded", "Arial Black", system-ui, sans-serif; text-wrap: balance; }
p { margin: 0; color: var(--plum-soft); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
a {
  display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 12px 26px; border-radius: 99px; border: 2px solid var(--rose);
  background: var(--rose); color: var(--white); font-weight: 600; text-decoration: none;
}
a:hover { background: var(--rose-deep); border-color: var(--rose-deep); }
a.ghost { background: transparent; color: var(--plum); border-color: var(--plum); }
a.ghost:hover { background: var(--plum); color: var(--white); }
a:focus-visible { outline: 3px solid var(--rose-deep); outline-offset: 3px; }
</style>
</head>

<main>

  <div class="actions">

    <a class="ghost" href="/pukh-i-losk/#book">Записать питомца</a>
  </div>
</main>
</body>
